[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfpage"
version = "0.1.0"
description = "Read a PDF in a browser at a chosen page, from any of your devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bill Basener" }]
keywords = ["pdf", "viewer", "citation", "tailscale"]
dependencies = []  # the standard library, plus poppler-utils and tailscale as outside programs

[project.urls]
Homepage = "https://github.com/wbasener/pdfpage"

[project.scripts]
pdfpage = "pdfpage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfpage"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
